<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover 让内容延伸到刘海/灵动岛区域；user-scalable=no 防止误缩放，更像原生 App -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>极简记账</title>

  <!-- ==================== PWA / iOS 添加到主屏幕配置 ==================== -->
  <meta name="apple-mobile-web-app-capable" content="yes">          <!-- 全屏 standalone，无 Safari 地址栏 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="极简记账">
  <meta name="theme-color" content="#f8fafc">

  <!-- Tailwind CSS（唯一外部依赖，仅样式，不是框架逻辑） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Helvetica Neue"', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    /* 小屏高度兜底：旧版 Safari 用 vh，新版用 dvh（地址栏收起时不跳动） */
    .app-shell { height: 100vh; height: 100dvh; }
    html, body { height: 100%; margin: 0; }
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      background: #e2e8f0;
    }
    /* 安全区适配：底部 Home Indicator 不会被导航条遮挡 */
    .safe-top    { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    /* iOS 输入框聚焦时，字号 >=16px 才不会自动放大页面 */
    input { font-size: 16px; }
    button { touch-action: manipulation; }
    .press:active { transform: scale(.97); opacity: .78; }
    .press { transition: transform .1s ease, opacity .1s ease; }
  </style>
</head>

<body class="font-sans text-slate-900 antialiased">
  <div class="app-shell mx-auto flex max-w-md flex-col overflow-hidden bg-slate-50 shadow-xl">

    <!-- ==================== 顶部栏 ==================== -->
    <header class="safe-top flex items-center justify-between border-b border-slate-200 bg-white px-5 py-3">
      <h1 class="text-lg font-semibold tracking-tight">极简记账</h1>
      <div class="flex items-center gap-1.5">
        <button id="importBtn" type="button"
          class="press rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs font-medium text-slate-600">
          导入
        </button>
        <button id="exportBtn" type="button"
          class="press rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs font-medium text-slate-600">
          导出
        </button>
      </div>
    </header>

    <!-- 隐藏的文件选择器：导入 CSV 时用 -->
    <input id="importFile" type="file" accept=".csv,text/csv" class="hidden">

    <!-- ==================== 三个页面（默认显示记账录入页） ==================== -->
    <main id="scroller" class="no-scrollbar relative flex-1 overflow-y-auto">

      <!-- ---------- 页面 1：记账录入 ---------- -->
      <section id="view-entry" class="px-5 pb-8 pt-4">
        <!-- 收入 / 支出 切换，默认支出 -->
        <div class="mx-auto flex w-64 rounded-2xl bg-slate-200/70 p-1">
          <button type="button" data-type="expense" class="type-btn press flex-1 rounded-xl py-2 text-sm font-medium">支出</button>
          <button type="button" data-type="income"  class="type-btn press flex-1 rounded-xl py-2 text-sm font-medium">收入</button>
        </div>

        <!-- 金额显示区（大字号，单手易读） -->
        <div class="mt-7 text-center">
          <div class="text-xs text-slate-400">金额（元）</div>
          <div class="mt-1 flex items-end justify-center gap-1.5">
            <span class="mb-2 text-2xl font-normal text-slate-400">¥</span>
            <span id="amountDisplay" class="text-5xl font-semibold tabular-nums tracking-tight text-slate-900">0</span>
          </div>
        </div>

        <!-- 分类标签：点选，无需输入 -->
        <div class="mt-6">
          <div class="mb-2 text-xs font-medium text-slate-400">分类</div>
          <div id="categoryList" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- 备注（选填） + 自动时间说明 -->
        <div class="mt-5">
          <label for="noteInput" class="mb-2 block text-xs font-medium text-slate-400">备注（选填）</label>
          <input id="noteInput" type="text" maxlength="40" enterkeyhint="done" placeholder="写点什么…"
            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base outline-none transition-colors focus:border-indigo-400">
          <p class="mt-2 text-[11px] text-slate-400">时间：自动记录当前时刻，无需手动修改</p>
        </div>

        <!-- 保存按钮 -->
        <button id="saveBtn" type="button"
          class="press mt-5 w-full rounded-2xl bg-indigo-600 py-3.5 text-base font-semibold text-white shadow-sm shadow-indigo-200">
          保存记录
        </button>

        <!-- 自定义数字键盘：大按钮，适配拇指操作 -->
        <div id="keypad" class="mt-5 grid grid-cols-3 gap-2"></div>

        <p class="mt-5 text-center text-[11px] leading-5 text-slate-400">
          所有数据仅保存在本机浏览器<br>不会上传服务器
        </p>
      </section>

      <!-- ---------- 页面 2：流水列表 ---------- -->
      <section id="view-list" class="hidden px-5 pb-8 pt-4">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-base font-semibold">流水明细</h2>
          <span id="listCount" class="text-xs text-slate-400">共 0 笔</span>
        </div>
        <div id="recordList" class="space-y-2"></div>
        <div id="emptyList" class="mt-24 hidden text-center text-sm leading-6 text-slate-400">
          还没有记录<br>去记一笔吧
        </div>
      </section>

      <!-- ---------- 页面 3：简单统计 ---------- -->
      <section id="view-stats" class="hidden px-5 pb-8 pt-4">
        <h2 class="text-base font-semibold"><span id="statMonth">本月</span>统计</h2>

        <div class="mt-4 grid grid-cols-2 gap-3">
          <div class="rounded-2xl border border-slate-100 bg-white p-4 shadow-sm">
            <div class="text-xs text-slate-400">本月总收入</div>
            <div id="statIncome" class="mt-2 text-2xl font-semibold tabular-nums text-emerald-600">¥0.00</div>
          </div>
          <div class="rounded-2xl border border-slate-100 bg-white p-4 shadow-sm">
            <div class="text-xs text-slate-400">本月总支出</div>
            <div id="statExpense" class="mt-2 text-2xl font-semibold tabular-nums text-rose-600">¥0.00</div>
          </div>
        </div>

        <div class="mt-3 rounded-2xl bg-indigo-600 p-4 text-white shadow-sm shadow-indigo-200">
          <div class="text-xs text-indigo-100">本月结余</div>
          <div id="statBalance" class="mt-1 text-3xl font-semibold tabular-nums">¥0.00</div>
        </div>

        <div class="mt-8 rounded-2xl border border-dashed border-slate-200 p-4 text-center text-xs leading-6 text-slate-400">
          统计范围：当前自然月<br>数据只在本机，不联网、不同步
        </div>
      </section>
    </main>

    <!-- ==================== 底部导航（三个页面） ==================== -->
    <nav class="safe-bottom grid grid-cols-3 border-t border-slate-200 bg-white">
      <button type="button" data-tab="entry" class="tab press flex flex-col items-center gap-0.5 py-2 text-[11px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-5 w-5"><path d="M12 5v14M5 12h14"/></svg>
        <span>记账</span>
      </button>
      <button type="button" data-tab="list" class="tab press flex flex-col items-center gap-0.5 py-2 text-[11px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-5 w-5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>流水</span>
      </button>
      <button type="button" data-tab="stats" class="tab press flex flex-col items-center gap-0.5 py-2 text-[11px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-5 w-5"><path d="M3 20h18M7 20v-6M12 20V8M17 20v-10"/></svg>
        <span>统计</span>
      </button>
    </nav>
  </div>

  <!-- ==================== 轻提示 ==================== -->
  <div id="toast" class="pointer-events-none fixed bottom-24 left-1/2 z-[60] -translate-x-1/2 rounded-full bg-slate-900/90 px-5 py-2.5 text-sm text-white opacity-0 transition-opacity duration-200"></div>

  <!-- ==================== 删除确认弹层 ==================== -->
  <div id="confirmLayer" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/30 p-4">
    <div class="w-full max-w-md rounded-3xl bg-white p-5 shadow-xl">
      <div id="confirmTitle" class="text-base font-semibold"></div>
      <div id="confirmDesc" class="mt-1 text-sm text-slate-400"></div>
      <div class="mt-5 flex gap-3">
        <button id="confirmCancel" type="button" class="press flex-1 rounded-2xl bg-slate-100 py-3 text-sm font-medium text-slate-600">取消</button>
        <button id="confirmOk" type="button" class="press flex-1 rounded-2xl bg-rose-600 py-3 text-sm font-medium text-white">删除</button>
      </div>
    </div>
  </div>

  <!-- ==================== 改分类弹层 ==================== -->
  <div id="categoryLayer" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/30 p-4">
    <div class="w-full max-w-md rounded-3xl bg-white p-5 shadow-xl">
      <div id="categoryTitle" class="text-base font-semibold">修改分类</div>
      <div id="categoryHint" class="mt-1 text-sm text-slate-400"></div>
      <div id="categoryOptions" class="mt-5 flex flex-wrap gap-2"></div>
      <button id="categoryCancel" type="button" class="press mt-5 w-full rounded-2xl bg-slate-100 py-3 text-sm font-medium text-slate-600">取消</button>
    </div>
  </div>

  <!-- ==================== 改备注弹层 ==================== -->
  <div id="noteLayer" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/30 p-4">
    <div class="w-full max-w-md rounded-3xl bg-white p-5 shadow-xl">
      <div class="text-base font-semibold">修改备注</div>
      <div id="noteHint" class="mt-1 text-sm text-slate-400"></div>
      <!-- 预填当前备注；留空保存即清空备注 -->
      <input id="noteEditInput" type="text" maxlength="40" enterkeyhint="done" placeholder="写点什么…（留空即清空）"
             class="mt-4 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-indigo-500">
      <div class="mt-5 flex gap-3">
        <button id="noteEditCancel" type="button" class="press flex-1 rounded-2xl bg-slate-100 py-3 text-sm font-medium text-slate-600">取消</button>
        <button id="noteEditSave" type="button" class="press flex-1 rounded-2xl bg-indigo-600 py-3 text-sm font-medium text-white">保存</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* =========================================================
       0. 基础配置与工具函数
       ========================================================= */
    const $ = (sel) => document.querySelector(sel);

    // 分类表：支出 6 类、收入 2 类（点选，不需要输入）
    const CATEGORIES = {
      expense: ['餐饮', '交通', '购物', '居住', '娱乐', '其他'],
      income:  ['工资', '其他']
    };

    const state = {
      type: 'expense',                 // 当前收支类型，默认支出
      category: CATEGORIES.expense[0], // 当前分类
      amountRaw: '',                   // 金额原始字符串（支持小数点）
      records: [],                     // 全部记录（按时间倒序）
      pendingAction: null,             // 确认弹层的回调
      editingId: null                  // 正在编辑（改分类/改备注）的记录 id
    };

    let db = null;                     // IndexedDB 实例

    const pad = (n) => String(n).padStart(2, '0');
    const escapeHtml = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    // 轻提示
    let toastTimer = null;
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
    }

    /* =========================================================
       1. IndexedDB：纯本地存储，无后端、无上传
       ========================================================= */
    const DB_NAME = 'minimal-ledger';
    const STORE = 'records';

    function openDB() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('此浏览器不支持 IndexedDB'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const database = req.result;
          if (!database.objectStoreNames.contains(STORE)) {
            const store = database.createObjectStore(STORE, { keyPath: 'id' });
            store.createIndex('createdAt', 'createdAt'); // 便于按时间排序
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // iOS Safari 会把后台页面的 IndexedDB 连接自动关闭，快捷指令唤醒后
    // 旧的 db 引用已经失效，直接 transaction 会抛 "connection is closing"。
    // 这里统一走事务执行器：遇到连接失效就重开一次，再自动重试该操作。
    function isConnError(err) {
      return /closing|closed|InvalidState|not active|connection/i.test(
        String((err && err.message) || err || '')
      );
    }

    function reopenDB() {
      try { if (db) db.close(); } catch (e) {}
      db = null;
      return openDB().then((fresh) => { db = fresh; return fresh; });
    }

    function runTx(mode, fn, retried) {
      return new Promise((resolve, reject) => {
        // 连接还没打开（冷启动时 hashchange 可能抢在 init 之前触发）
        if (!db) {
          openDB().then((fresh) => { db = fresh; return runTx(mode, fn, retried); })
                  .then(resolve, reject);
          return;
        }
        let req;
        try {
          req = fn(db.transaction(STORE, mode).objectStore(STORE));
        } catch (err) {
          if (!retried && isConnError(err)) {
            reopenDB().then(() => runTx(mode, fn, true)).then(resolve, reject);
          } else {
            reject(err);
          }
          return;
        }
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => {
          const err = req.error;
          if (!retried && isConnError(err)) {
            reopenDB().then(() => runTx(mode, fn, true)).then(resolve, reject);
          } else {
            reject(err || new Error('数据库操作失败'));
          }
        };
      });
    }

    function getAllRecords() {
      return runTx('readonly', (store) => store.getAll())
        .then((rows) => rows.sort((a, b) => b.createdAt - a.createdAt));
    }

    function addRecord(record) {
      return runTx('readwrite', (store) => store.add(record));
    }

    // 批量写入（导入 CSV 用）：单个事务写完，同样带连接失效重连
    function addRecords(records, retried) {
      return new Promise((resolve, reject) => {
        if (!db) {
          openDB().then((fresh) => { db = fresh; return addRecords(records, retried); })
                  .then(resolve, reject);
          return;
        }
        let tx;
        try {
          tx = db.transaction(STORE, 'readwrite');
        } catch (err) {
          if (!retried && isConnError(err)) {
            reopenDB().then(() => addRecords(records, true)).then(resolve, reject);
          } else reject(err);
          return;
        }
        const store = tx.objectStore(STORE);
        records.forEach((r) => store.add(r));
        tx.oncomplete = () => resolve();
        tx.onerror = () => {
          if (!retried && isConnError(tx.error)) {
            reopenDB().then(() => addRecords(records, true)).then(resolve, reject);
          } else reject(tx.error || new Error('导入失败'));
        };
      });
    }

    function deleteRecord(id) {
      return runTx('readwrite', (store) => store.delete(id));
    }

    // 修改单条记录的某个字段（category / note）：先 get 出原记录，只改目标字段再 put 回去
    // 同样带连接失效重连，和 runTx 保持一致
    function updateField(id, field, value, retried) {
      return new Promise((resolve, reject) => {
        if (!db) {
          openDB().then((fresh) => { db = fresh; return updateField(id, field, value, retried); })
                  .then(resolve, reject);
          return;
        }
        let tx;
        try {
          tx = db.transaction(STORE, 'readwrite');
        } catch (err) {
          if (!retried && isConnError(err)) {
            reopenDB().then(() => updateField(id, field, value, true)).then(resolve, reject);
          } else reject(err);
          return;
        }
        const store = tx.objectStore(STORE);
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const record = getReq.result;
          if (!record) { reject(new Error('记录不存在')); return; }
          record[field] = value;
          store.put(record);
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => {
          if (!retried && isConnError(tx.error)) {
            reopenDB().then(() => updateField(id, field, value, true)).then(resolve, reject);
          } else reject(tx.error || new Error('修改失败'));
        };
      });
    }

    /* =========================================================
       2. 录入页：类型切换 / 键盘 / 分类 / 金额
       ========================================================= */

    // 生成自定义数字键盘（1-9 / . / 0 / 退格）
    function buildKeypad() {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'];
      $('#keypad').innerHTML = keys.map((k) => {
        const label = k === 'del' ? '⌫' : k;
        const cls = (k === '.' || k === 'del')
          ? 'bg-slate-100 text-slate-600'
          : 'bg-white text-slate-900';
        return '<button type="button" data-key="' + k + '" class="press flex h-14 items-center justify-center rounded-2xl border border-slate-200 ' + cls + ' text-2xl font-medium shadow-sm">' + label + '</button>';
      }).join('');
    }

    // 切换支出 / 收入：分类同步重置为该类型第一项
    function setType(type) {
      state.type = type;
      state.category = CATEGORIES[type][0];
      document.querySelectorAll('.type-btn').forEach((btn) => {
        const active = btn.dataset.type === type;
        btn.className = 'type-btn press flex-1 rounded-xl py-2 text-sm font-medium ' +
          (active ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500');
      });
      renderCategories();
    }

    // 渲染分类标签
    function renderCategories() {
      $('#categoryList').innerHTML = CATEGORIES[state.type].map((cat) => {
        const active = cat === state.category;
        return '<button type="button" data-cat="' + cat + '" class="press rounded-full border px-4 py-2 text-sm font-medium ' +
          (active ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600') +
          '">' + cat + '</button>';
      }).join('');
    }

    // 千分位格式化（仅显示用，存储仍是纯数字）
    function formatRaw(raw) {
      if (!raw) return '';
      const parts = raw.split('.');
      const intPart = (parts[0] || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.length === 2 ? intPart + '.' + parts[1] : intPart;
    }

    function renderAmount() {
      $('#amountDisplay').textContent = formatRaw(state.amountRaw) || '0';
    }

    // 键盘输入逻辑：限制整数 8 位、小数 2 位
    function pressKey(key) {
      if (key === 'del') {
        state.amountRaw = state.amountRaw.slice(0, -1);
      } else if (key === '.') {
        if (!state.amountRaw.includes('.')) {
          state.amountRaw = (state.amountRaw || '0') + '.';
        }
      } else {
        const parts = state.amountRaw.split('.');
        if (parts.length === 2 && parts[1].length >= 2) return toast('最多两位小数');
        if (parts.length === 1 && parts[0].length >= 8) return toast('金额过大');
        state.amountRaw = (state.amountRaw === '0' ? '' : state.amountRaw) + key;
      }
      renderAmount();
    }

    // 保存一笔：时间取当前时刻，不提供手动修改
    async function saveRecord() {
      const amount = Number(state.amountRaw);
      if (!state.amountRaw || !(amount > 0)) return toast('请输入金额');

      const record = {
        id: (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now() + '-' + Math.random().toString(36).slice(2),
        type: state.type,
        amount: Math.round(amount * 100) / 100,
        category: state.category,
        note: $('#noteInput').value.trim(),
        createdAt: Date.now()          // 当前时间戳
      };

      try {
        await addRecord(record);
        state.amountRaw = '';
        $('#noteInput').value = '';
        renderAmount();
        toast('已保存');
        await refreshViews();
        // 停留在录入页，方便连续记账
      } catch (err) {
        toast('保存失败：' + err.message);
      }
    }

    /* =========================================================
       3. 流水列表 / 统计 渲染
       ========================================================= */

    async function refreshViews() {
      try {
        state.records = await getAllRecords();
      } catch (err) {
        state.records = [];
        toast('读取本地数据失败');
      }
      renderList(state.records);
      renderStats(state.records);
    }

    const fmtDateHeader = (d) =>
      (d.getFullYear() === new Date().getFullYear()
        ? (d.getMonth() + 1) + '月' + d.getDate() + '日'
        : d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日') +
      ' 周' + '日一二三四五六'[d.getDay()];

    function renderList(records) {
      const el = $('#recordList');
      $('#listCount').textContent = '共 ' + records.length + ' 笔';
      $('#emptyList').classList.toggle('hidden', records.length > 0);

      if (!records.length) { el.innerHTML = ''; return; }

      // 先按天汇总收入/支出，用于每天分隔标题上的当日合计
      const dayTotals = new Map();
      records.forEach((r) => {
        const d = new Date(r.createdAt);
        const dayKey = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        let t = dayTotals.get(dayKey);
        if (!t) { t = { income: 0, expense: 0 }; dayTotals.set(dayKey, t); }
        if (r.type === 'income') t.income += r.amount;
        else t.expense += r.amount;
      });

      let html = '';
      let lastDay = '';
      records.forEach((r) => {
        const d = new Date(r.createdAt);
        const dayKey = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        if (dayKey !== lastDay) {
          const t = dayTotals.get(dayKey);
          // 只显示当天实际发生的收入/支出项，避免标题过长
          let sum = '';
          if (t.income > 0) sum += '<span class="text-emerald-600">收 ¥' + t.income.toFixed(2) + '</span>';
          if (t.expense > 0) sum += (sum ? '<span class="mx-1.5 text-slate-300">·</span>' : '') +
                                     '<span class="text-slate-500">支 ¥' + t.expense.toFixed(2) + '</span>';
          html += '<div class="flex items-baseline justify-between gap-2 px-1 pb-1 pt-3 text-xs">' +
                    '<span class="font-medium text-slate-400">' + fmtDateHeader(d) + '</span>' +
                    '<span class="shrink-0 tabular-nums">' + sum + '</span>' +
                  '</div>';
          lastDay = dayKey;
        }

        const isIncome = r.type === 'income';
        const sign = isIncome ? '+' : '−';
        const amountColor = isIncome ? 'text-emerald-600' : 'text-slate-800';
        const badgeColor = isIncome
          ? 'bg-emerald-50 text-emerald-600'
          : 'bg-indigo-50 text-indigo-600';
        const time = pad(d.getHours()) + ':' + pad(d.getMinutes());
        const note = r.note ? ' · ' + escapeHtml(r.note) : '';

        html +=
          '<div class="flex items-center gap-3 rounded-2xl border border-slate-100 bg-white p-3.5 shadow-sm">' +
            '<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-xs font-medium ' + badgeColor + '">' + escapeHtml(r.category) + '</div>' +
            '<div class="min-w-0 flex-1">' +
              '<div class="truncate text-sm font-medium">' + escapeHtml(r.category) + '</div>' +
              '<div class="mt-0.5 truncate text-xs text-slate-400">' + time + note + '</div>' +
            '</div>' +
            '<div class="shrink-0 text-right">' +
              '<div class="text-sm font-semibold tabular-nums ' + amountColor + '">' + sign + '¥' + r.amount.toFixed(2) + '</div>' +
              '<div class="mt-1 flex items-center justify-end gap-3">' +
                '<button type="button" data-edit="' + r.id + '" class="press text-[11px] text-indigo-500">改分类</button>' +
                '<button type="button" data-note="' + r.id + '" class="press text-[11px] text-indigo-500">改备注</button>' +
                '<button type="button" data-del="' + r.id + '" class="press text-[11px] text-slate-400">删除</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      });
      el.innerHTML = html;
    }

    function renderStats(records) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      $('#statMonth').textContent = year + '年' + (month + 1) + '月';

      let income = 0;
      let expense = 0;
      records.forEach((r) => {
        const d = new Date(r.createdAt);
        if (d.getFullYear() !== year || d.getMonth() !== month) return;
        if (r.type === 'income') income += r.amount;
        else expense += r.amount;
      });

      income = Math.round(income * 100) / 100;
      expense = Math.round(expense * 100) / 100;
      const balance = Math.round((income - expense) * 100) / 100;

      $('#statIncome').textContent = '¥' + income.toFixed(2);
      $('#statExpense').textContent = '¥' + expense.toFixed(2);
      $('#statBalance').textContent = (balance < 0 ? '−¥' : '¥') + Math.abs(balance).toFixed(2);
    }

    /* =========================================================
       4. 导出 CSV（全部记录，带 BOM，Excel 打开中文不乱码）
       ========================================================= */
    function exportCSV() {
      if (!state.records.length) return toast('暂无记录可导出');

      // 第一列 id 用于导入时精确去重（旧版 CSV 无此列，也能按内容去重）
      const rows = [['id', '时间', '类型', '金额', '分类', '备注']];
      state.records.forEach((r) => {
        const d = new Date(r.createdAt);
        const ts = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
                   pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        rows.push([
          r.id,
          ts,
          r.type === 'income' ? '收入' : '支出',
          (r.type === 'income' ? '' : '-') + r.amount.toFixed(2),
          r.category,
          r.note || ''
        ]);
      });

      // 双引号转义，避免备注里的逗号/换行破坏 CSV
      const csv = '\uFEFF' + rows.map((row) =>
        row.map((cell) => '"' + String(cell).replace(/"/g, '""') + '"').join(',')
      ).join('\r\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '极简记账-' + new Date().getFullYear() + pad(new Date().getMonth() + 1) + pad(new Date().getDate()) + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('已导出全部记录');
    }

    /* =========================================================
       4.2 导入 CSV（本地解析并合并，按 id / 内容签名去重）
       兼容：新版带 id 列；旧版只有「时间/类型/金额/分类/备注」五列。
       ========================================================= */

    // 解析 CSV 文本为二维数组：正确处理双引号包裹、字段内逗号/换行/双引号转义
    function parseCSV(text) {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // 去 BOM
      const rows = [];
      let row = [], cell = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i++; } // "" → 一个双引号
            else quoted = false;
          } else cell += ch;
        } else {
          if (ch === '"') quoted = true;
          else if (ch === ',') { row.push(cell); cell = ''; }
          else if (ch === '\n') {
            if (cell.endsWith('\r')) cell = cell.slice(0, -1);
            row.push(cell); rows.push(row); row = []; cell = '';
          } else cell += ch;
        }
      }
      if (cell.length || row.length) { row.push(cell); rows.push(row); }
      return rows.filter((r) => r.some((c) => c !== '')); // 丢弃空行
    }

    // 记录内容签名：用于旧版无 id 的 CSV 去重（同时间/类型/金额/分类/备注视为同一笔）
    function recordSignature(r) {
      return [r.createdAt, r.type, r.amount.toFixed(2), r.category, r.note || ''].join('|');
    }

    async function importCSV(file) {
      let text;
      try {
        text = await file.text();
      } catch (err) {
        return toast('读取文件失败：' + err.message);
      }
      const rows = parseCSV(text);
      if (rows.length < 2) return toast('文件里没有可导入的记录');

      // 按表头名定位列，容忍列顺序不同
      const header = rows[0].map((h) => String(h).trim().replace(/^\uFEFF/, ''));
      const col = (name) => header.indexOf(name);
      const idxId = col('id'), idxTime = col('时间'), idxType = col('类型');
      const idxAmount = col('金额'), idxCat = col('分类'), idxNote = col('备注');
      if (idxTime < 0 || idxAmount < 0) return toast('CSV 缺少「时间」或「金额」列');

      const existingIds = new Set(state.records.map((r) => r.id));
      const existingSigs = new Set(state.records.map(recordSignature));
      const toAdd = [];
      let skipped = 0, invalid = 0;

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const timeStr = String(row[idxTime] || '').trim();
        const createdAt = new Date(timeStr.replace(' ', 'T')).getTime();
        const rawAmount = String(row[idxAmount] || '').trim();
        const amount = Math.abs(parseFloat(rawAmount));
        if (!timeStr || isNaN(createdAt) || isNaN(amount) || amount <= 0) { invalid++; continue; }

        const typeRaw = String(idxType >= 0 ? row[idxType] : '').trim();
        const type = /收入|income/i.test(typeRaw) ? 'income' : 'expense';
        const catRaw = String(idxCat >= 0 ? row[idxCat] : '').trim();
        const category = CATEGORIES[type].includes(catRaw) ? catRaw : '其他';
        const note = String(idxNote >= 0 ? row[idxNote] : '').trim().slice(0, 40);

        const record = {
          id: (idxId >= 0 && String(row[idxId] || '').trim())
                ? String(row[idxId]).trim()
                : (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : Date.now() + '-' + Math.random().toString(36).slice(2),
          type: type,
          amount: amount,
          category: category,
          note: note,
          createdAt: createdAt
        };
        // 有 id 就按 id 判重；无 id 则按内容签名判重（含本批次内互相去重）
        const sig = recordSignature(record);
        if (existingIds.has(record.id) || existingSigs.has(sig)) { skipped++; continue; }
        existingIds.add(record.id);
        existingSigs.add(sig);
        toAdd.push(record);
      }

      if (!toAdd.length) return toast(skipped ? ('全部重复，未导入 ' + skipped + ' 笔') : '没有可导入的有效记录');
      try {
        await addRecords(toAdd);
        await refreshViews();
        toast('已导入 ' + toAdd.length + ' 笔' + (skipped ? '，跳过重复 ' + skipped + ' 笔' : '') +
              (invalid ? '，忽略无效 ' + invalid + ' 笔' : ''));
      } catch (err) {
        toast('导入失败：' + err.message);
      }
    }

    /* =========================================================
       4.5 支付通知自动入账（快捷指令 → #fragment → 本地保存）
       说明：参数放在 # 后面，不会随 HTTP 请求发给服务器。
       用法：https://mf-ray.github.io/#auto=1&amount=28.50&raw=微信支付-美团-28.50元&type=expense
       ========================================================= */

    // 根据通知原文猜分类（关键词映射，猜错可在流水里删除重记）
    function guessCategory(type, raw) {
      if (type === 'income') {
        return /工资|薪资|薪|报销|退款|入账|收入/.test(raw) ? '工资' : '其他';
      }
      const rules = [
        [/美团|饿了么|外卖|餐|饭|咖啡|奶茶|星巴克|瑞幸|海底捞|肯德基|麦当劳|必胜客|食堂|面包|蛋糕|饮食|食品/, '餐饮'],
        [/滴滴|打车|地铁|公交|高铁|火车|机票|飞机|加油|停车|单车|出行|交通|巴士|出租/, '交通'],
        [/淘宝|京东|拼多多|购物|商城|商场|优衣库|服饰|鞋|数码|盒马|超市|网购/, '购物'],
        [/房租|租金|物业|水费|电费|燃气|宽带|住房|租房|房贷/, '居住'],
        [/电影|票房|游戏|KTV|视频|会员|音乐|娱乐|影院|演出|演唱会|爱奇艺|腾讯视频|网易云/, '娱乐']
      ];
      for (let i = 0; i < rules.length; i++) {
        if (rules[i][0].test(raw)) return rules[i][1];
      }
      return '其他';
    }

    // 把通知原文压成简短备注
    function extractNote(raw) {
      if (!raw) return '支付通知自动记账';
      return raw.replace(/^(微信支付|支付宝|支付成功|交易提醒)[：:\s-]*/, '').slice(0, 30);
    }

    // 解析 hash 并自动保存；保存后立即清掉 hash，防止刷新重复记账
    function handleAutoEntry() {
      const hash = location.hash || '';
      if (!hash.startsWith('#auto=1')) return;

      const params = new URLSearchParams(hash.slice(1));
      let amount = parseFloat(params.get('amount'));
      const raw = decodeURIComponentSafely(params.get('raw') || '');
      const type = params.get('type') === 'income' ? 'income' : 'expense';

      // 先清地址，再处理，避免 hashchange + load 双触发重复保存
      history.replaceState(null, '', location.pathname + location.search);

      if (!(amount > 0)) return toast('自动记账失败：未识别到金额');
      amount = Math.round(amount * 100) / 100;

      const record = {
        id: (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now() + '-' + Math.random().toString(36).slice(2),
        type: type,
        amount: amount,
        category: guessCategory(type, raw),
        note: extractNote(raw),
        createdAt: Date.now()
      };

      addRecord(record).then(async () => {
        await refreshViews();
        toast('已自动记账：' + record.category + ' ¥' + amount.toFixed(2));
      }).catch((err) => {
        toast('自动记账失败：' + err.message);
      });
    }

    function decodeURIComponentSafely(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }

    /* =========================================================
       5. 页面切换 / 删除确认
       ========================================================= */
    function showTab(name) {
      ['entry', 'list', 'stats'].forEach((n) => {
        $('#view-' + n).classList.toggle('hidden', n !== name);
      });
      document.querySelectorAll('.tab').forEach((btn) => {
        const active = btn.dataset.tab === name;
        btn.className = 'tab press flex flex-col items-center gap-0.5 py-2 text-[11px] ' +
          (active ? 'text-indigo-600' : 'text-slate-400');
      });
      $('#scroller').scrollTop = 0;
      if (name === 'list' || name === 'stats') refreshViews();
    }

    function showConfirm(title, desc, action) {
      state.pendingAction = action;
      $('#confirmTitle').textContent = title;
      $('#confirmDesc').textContent = desc;
      $('#confirmLayer').style.display = 'flex';
    }
    function hideConfirm() {
      $('#confirmLayer').style.display = 'none';
      state.pendingAction = null;
    }

    // 打开「改分类」弹层：按该记录的收支类型显示对应分类
    function showCategoryPicker(id) {
      const rec = state.records.find((r) => r.id === id);
      if (!rec) return toast('记录不存在');
      state.editingId = id;
      const isIncome = rec.type === 'income';
      $('#categoryHint').textContent =
        (isIncome ? '收入' : '支出') + ' ¥' + rec.amount.toFixed(2) + ' · 当前：' + rec.category;
      $('#categoryOptions').innerHTML = CATEGORIES[rec.type].map((cat) => {
        const active = cat === rec.category;
        return '<button type="button" data-pick="' + cat + '" class="press rounded-full border px-4 py-2 text-sm font-medium ' +
          (active ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600') +
          '">' + cat + '</button>';
      }).join('');
      $('#categoryLayer').style.display = 'flex';
    }
    function hideCategoryPicker() {
      $('#categoryLayer').style.display = 'none';
      state.editingId = null;
    }

    // 打开「改备注」弹层：预填当前备注，留空保存即清空
    function showNoteEditor(id) {
      const rec = state.records.find((r) => r.id === id);
      if (!rec) return toast('记录不存在');
      state.editingId = id;
      $('#noteHint').textContent =
        (rec.type === 'income' ? '收入' : '支出') + ' ¥' + rec.amount.toFixed(2) + ' · ' + rec.category;
      $('#noteEditInput').value = rec.note || '';
      $('#noteLayer').style.display = 'flex';
      // 弹层出现后自动聚焦并弹出键盘，减少一次点按
      setTimeout(() => $('#noteEditInput').focus(), 50);
    }
    function hideNoteEditor() {
      $('#noteLayer').style.display = 'none';
      state.editingId = null;
    }
    // 保存备注：允许清空（空字符串）
    async function saveNoteEdit() {
      const id = state.editingId;
      if (!id) return;
      const note = $('#noteEditInput').value.trim();
      hideNoteEditor();
      try {
        await updateField(id, 'note', note);
        toast(note ? '备注已更新' : '已清空备注');
        await refreshViews();
      } catch (err) {
        toast('修改失败：' + err.message);
      }
    }

    /* =========================================================
       6. PWA 图标与 manifest（运行时生成，保持只有一个文件）
       说明：Service Worker 必须是独立同源 JS 文件，单文件方案无法注册，
            因此不做离线缓存；iOS 全屏由 apple-mobile-web-app-capable 实现。
       ========================================================= */
    function initPWA() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 180;
      const ctx = canvas.getContext('2d');
      // 圆角底色
      ctx.fillStyle = '#4f46e5';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, 0, 180, 180, 40);
      else {
        ctx.moveTo(40, 0); ctx.lineTo(140, 0); ctx.quadraticCurveTo(180, 0, 180, 40);
        ctx.lineTo(180, 140); ctx.quadraticCurveTo(180, 180, 140, 180);
        ctx.lineTo(40, 180); ctx.quadraticCurveTo(0, 180, 0, 140);
        ctx.lineTo(0, 40); ctx.quadraticCurveTo(0, 0, 40, 0);
      }
      ctx.fill();
      // 白色 ¥ 符号
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 96px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', 90, 94);
      const icon = canvas.toDataURL('image/png');

      // apple-touch-icon：添加到主屏幕时的图标
      const iconLink = document.createElement('link');
      iconLink.rel = 'apple-touch-icon';
      iconLink.href = icon;
      document.head.appendChild(iconLink);

      // web app manifest（Android/Chrome 使用；iOS 主要读上面的 meta 标签）
      const manifest = {
        name: '极简记账',
        short_name: '极简记账',
        start_url: '.',
        scope: '.',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#f8fafc',
        theme_color: '#4f46e5',
        icons: [{ src: icon, sizes: '180x180', type: 'image/png', purpose: 'any maskable' }]
      };
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(new Blob(
        [JSON.stringify(manifest)], { type: 'application/manifest+json' }
      ));
      document.head.appendChild(manifestLink);
    }

    /* =========================================================
       7. 事件绑定
       ========================================================= */
    function bindEvents() {
      // 数字键盘
      $('#keypad').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-key]');
        if (btn) pressKey(btn.dataset.key);
      });

      // 收支切换
      document.querySelectorAll('.type-btn').forEach((btn) => {
        btn.addEventListener('click', () => setType(btn.dataset.type));
      });

      // 分类点选
      $('#categoryList').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-cat]');
        if (!btn) return;
        state.category = btn.dataset.cat;
        renderCategories();
      });

      $('#saveBtn').addEventListener('click', saveRecord);
      $('#exportBtn').addEventListener('click', exportCSV);

      // 导入 CSV：点按钮唤起文件选择，选中后本地解析合并
      $('#importBtn').addEventListener('click', () => $('#importFile').click());
      $('#importFile').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) importCSV(file);
        e.target.value = ''; // 清空，允许重复选同一个文件
      });

      // 底部导航
      document.querySelectorAll('.tab').forEach((btn) => {
        btn.addEventListener('click', () => showTab(btn.dataset.tab));
      });

      // 流水列表：改分类 / 改备注 / 删除（事件委托）
      $('#recordList').addEventListener('click', (e) => {
        const editBtn = e.target.closest('[data-edit]');
        if (editBtn) { showCategoryPicker(editBtn.dataset.edit); return; }

        const noteBtn = e.target.closest('[data-note]');
        if (noteBtn) { showNoteEditor(noteBtn.dataset.note); return; }

        const btn = e.target.closest('[data-del]');
        if (!btn) return;
        showConfirm('删除这条记录？', '删除后无法恢复', async () => {
          try {
            await deleteRecord(btn.dataset.del);
            toast('已删除');
            await refreshViews();
          } catch (err) {
            toast('删除失败：' + err.message);
          }
        });
      });

      // 改分类弹层：点某个分类即保存
      $('#categoryOptions').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-pick]');
        if (!btn || !state.editingId) return;
        const id = state.editingId;
        const category = btn.dataset.pick;
        hideCategoryPicker();
        updateField(id, 'category', category).then(async () => {
          toast('已改为：' + category);
          await refreshViews();
        }).catch((err) => toast('修改失败：' + err.message));
      });

      $('#categoryCancel').addEventListener('click', hideCategoryPicker);
      $('#categoryLayer').addEventListener('click', (e) => {
        if (e.target === $('#categoryLayer')) hideCategoryPicker();
      });

      // 改备注弹层
      $('#noteEditSave').addEventListener('click', saveNoteEdit);
      $('#noteEditCancel').addEventListener('click', hideNoteEditor);
      $('#noteEditInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveNoteEdit(); }
      });
      $('#noteLayer').addEventListener('click', (e) => {
        if (e.target === $('#noteLayer')) hideNoteEditor();
      });

      $('#confirmCancel').addEventListener('click', hideConfirm);
      $('#confirmLayer').addEventListener('click', (e) => {
        if (e.target === $('#confirmLayer')) hideConfirm();
      });
      $('#confirmOk').addEventListener('click', () => {
        const fn = state.pendingAction;
        hideConfirm();
        if (fn) fn();
      });

      // 备注输入时，Done 键收起键盘
      $('#noteInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
      });

      // 物理键盘也能输金额（录入页且备注未聚焦时）
      document.addEventListener('keydown', (e) => {
        if ($('#view-entry').classList.contains('hidden')) return;
        if (document.activeElement === $('#noteInput')) return;
        if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressKey(e.key); }
        else if (e.key === '.') { e.preventDefault(); pressKey('.'); }
        else if (e.key === 'Backspace') { e.preventDefault(); pressKey('del'); }
        else if (e.key === 'Enter') { e.preventDefault(); saveRecord(); }
      });

      // 快捷指令从后台打开带 #auto=1 的链接时，页面可能已经加载过，
      // 这里监听 hash 变化，确保冷启动和热唤醒都能自动入账
      window.addEventListener('hashchange', handleAutoEntry);
    }

    /* =========================================================
       8. 启动
       ========================================================= */
    async function init() {
      buildKeypad();
      setType('expense');      // 默认支出
      renderAmount();
      bindEvents();
      initPWA();
      showTab('entry');        // 打开页面默认记账录入页

      try {
        db = await openDB();
      } catch (err) {
        toast('本地存储不可用：' + err.message);
      }
      await refreshViews();

      // 冷启动时若链接带 #auto=1，自动入账
      handleAutoEntry();
    }

    init();
  })();
  </script>
</body>
</html>
